<style>

</style></head><body>
<div id="app"><main id="main"></main><div id="cb" hidden><input id="ci" placeholder="Ej: Súper 35.000 débito" autocomplete="off" enterkeyhint="send"><button class="b p" onclick="send()">Enviar</button></div>
<nav id="nav"></nav></div>
<script>
const $=s=>document.querySelector(s),pad=n=>String(n).padStart(2,'0');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:0}).format(n);
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>ymd(new Date()),addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const norm=s=>String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const slug=n=>'c_'+norm(n).replace(/[^a-z0-9]+/g,'_');
const MES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const mlabel=k=>MES[+k.slice(5,7)-1]+' '+k.slice(0,4);
const PAYS={efectivo:'Efectivo',debito:'Débito',credito:'Crédito',transferencia:'Transferencia',mercadopago:'Mercado Pago',otro:'Otro'};
const CATS0=[['Supermercado','🛒','super supermercado coto carrefour jumbo disco verduleria carniceria almacen chino verdura'],['Comida y delivery','🍕','pizza delivery rappi pedidosya comida restaurante cafe helado empanadas hamburguesa sushi cena almuerzo'],['Transporte y nafta','⛽','nafta combustible uber sube colectivo peaje estacionamiento taxi cabify subte'],['Hogar','🏠','casa hogar ferreteria muebles limpieza'],['Servicios e impuestos','💡','luz gas agua internet wifi expensas alquiler abl patente impuesto impuestos telefono celular seguro'],['Mascotas','🐾','veterinaria mascota mascotas perro gato balanceado'],['Salud y farmacia','💊','farmacia medico dentista remedio remedios prepaga'],['Ropa','👕','ropa zapatillas remera jean campera'],['Salidas y entretenimiento','🎉','cine boliche bar salida cerveza teatro recital'],['Compras personales','🛍️','regalo perfume maquillaje'],['Educación','📚','curso facultad libro colegio'],['Suscripciones','📺','netflix spotify disney hbo youtube suscripcion icloud chatgpt'],['Viajes','✈️','viaje hotel vuelo pasaje hospedaje'],['Ingresos','💰','sueldo cobre cobro honorarios freelance aguinaldo ingreso',1],['Otros','📦','']];
const KW={};CATS0.forEach(c=>KW[slug(c[0])]=c[2]);
let db,user,sample,me,txs=[],cats=[],accts=[],recs=[],pids=[],names={},month=today().slice(0,7),tab='chat',chat=[],pending=null,dupTx=null,undos=[],seeded=false,seededA=false,recDone=false,H={q:'',cat:'',who:'',pay:'',m:'',acct:''};
const act=()=>txs.filter(t=>!t.deleted);
const cat=id=>cats.find(c=>c.id===id)||{name:'Sin categoría',icon:'📦'};
const nm=id=>names[id]||(id===me?'Yo':'Pareja');
const sum=(l,t)=>l.filter(x=>x.type===t).reduce((a,x)=>a+x.amount,0);
const ac=id=>accts.find(a=>a.id===id),acName=id=>(ac(id)||{}).name||'Sin cuenta';
function bal(id){let v=+(ac(id)||{}).opening||0;act().forEach(t=>{if(t.type==='inc'&&t.acct===id)v+=t.amount;else if(t.type==='exp'&&t.acct===id)v-=t.amount;else if(t.type==='tr'){if(t.acct===id)v-=t.amount;if(t.to===id)v+=t.amount}});return v}
const unassigned=()=>act().filter(t=>t.type!=='tr'&&!ac(t.acct));
const total=()=>accts.reduce((s,a)=>s+bal(a.id),0);
function pickAcct(n,pay){const tk=n.split(/[^a-z0-9]+/).filter(Boolean),cash=accts.find(a=>a.cash),bank=accts.filter(a=>!a.cash);
 for(const a of accts){const w=norm(a.name).split(/[^a-z0-9]+/).filter(x=>x.length>=4&&x!=='cuenta');if(w.some(x=>tk.includes(x)))return a.id}
 if(pay==='efectivo'||/\bcash\b/.test(n))return cash?cash.id:'';
 if(/\bbanco\b/.test(n))return bank[0]?bank[0].id:'';
 if(pay==='mercadopago'){const m=bank.find(a=>/mercado/.test(norm(a.name)));if(m)return m.id}
 if(pay&&bank[0])return bank[0].id;return''}
function balTxt(n){const id=pickAcct(n,''),L=id?[ac(id)]:accts;return L.map(a=>a.icon+' '+esc(a.name)+': <b>'+fmt(bal(a.id))+'</b>').join('<br>')+(id?'':'<br><small class="mut">Total '+fmt(total())+'</small>')}
const accOpts=(s,all)=>opts(accts.map(a=>[a.id,a.icon+' '+a.name]),s,all);
function kwmatch(text){const tk=norm(text).split(/[^a-z0-9]+/).filter(Boolean);
 for(const c of cats){const w=((KW[c.id]||'')+' '+(KW[c.id]===undefined?norm(c.name):'')).split(' ').filter(Boolean);
  if(tk.some(t=>w.some(x=>t===x||(x.length>=5&&t.startsWith(x)))))return c}return null}
const STOP=new Set('gaste gastamos gastado compre compramos pague pagamos pago cobre cobramos cobro hoy ayer anteayer antes en por con el la los las un una unos al del de me nos a y para mi que fue fueron algo pesos ars debito credito tarjeta transferencia efectivo mercado pago mercadopago mp'.split(' '));
function parseAmt(text){const m=text.match(/\$?\s*(\d{1,3}(?:\.\d{3})+(?:,\d+)?|\d+(?:[.,]\d+)?)\s*(k\b|mil\b|lucas\b)?/i);if(!m)return null;
 let s=m[1],v=/\.\d{3}/.test(s)?+s.replace(/\./g,'').replace(',','.'):+s.replace(',','.');if(m[2])v*=1000;
 return Number.isFinite(v)&&v>0?{v:Math.round(v*100)/100,raw:m[0]}:null}
function parseDate(n){const now=new Date();let m;
 if(/antes de ayer|anteayer/.test(n))return ymd(addD(now,-2));if(/\bayer\b/.test(n))return ymd(addD(now,-1));
 if(m=n.match(/\b(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?/)){let y=m[3]?(+m[3]<100?2000+ +m[3]:+m[3]):now.getFullYear();const d=new Date(y,m[2]-1,m[1]);if(d.getMonth()==m[2]-1)return ymd(d)}
 return today()}
function parsePay(n){return /mercado ?pago|\bmp\b/.test(n)?'mercadopago':/efectivo|cash/.test(n)?'efectivo':/debito/.test(n)?'debito':/credito|tarjeta/.test(n)?'credito':/transfer/.test(n)?'transferencia':''}
function parse(t){const n=norm(t),a=parseAmt(t.replace(/\b\d{1,2}\/\d{1,2}(\/\d{2,4})?/g,' '));
 const inc=/\b(cobr|sueldo|ingres|me pagaron|nos pagaron|aguinaldo|honorarios|recibi|recibimos)/.test(n);
 let rest=a?t.replace(/\b\d{1,2}\/\d{1,2}(\/\d{2,4})?/g,' ').replace(a.raw,' '):t;
 const desc=rest.replace(/[$¿?¡!,.]/g,' ').split(/\s+/).filter(w=>w&&!STOP.has(norm(w))&&!pids.some(i=>i!==me&&norm(nm(i)).split(' ')[0]===norm(w))&&!/^\d+$/.test(w)).join(' ');
 let paidBy=me;const o=pids.filter(i=>i!==me);
 for(const i of o){const f=norm(nm(i)).split(' ')[0];if(f&&new RegExp('(pago|compro|gasto)\\s+(por\\s+)?'+f).test(n))paidBy=i}
 if(o.length===1&&/(pago|compro|gasto)\s+(mi novio|el novio|mi pareja|el)\b/.test(n))paidBy=o[0];
 let c=kwmatch(inc?desc+' '+n:desc||n);if(inc&&!c)c=cats.find(x=>x.income)||null;
 return{type:inc?'inc':'exp',amount:a&&a.v,desc:desc?desc[0].toUpperCase()+desc.slice(1):(inc?'Ingreso':''),date:parseDate(n),pay:parsePay(n),acct:pickAcct(n,parsePay(n)),catId:c&&c.id,paidBy,own:/entre (mis )?cuentas|transferencia propia|pase de cuenta/.test(n)}}
async function aiCat(text){if(!sample)return null;try{const r=await sample.json('Elegí la categoría de gasto más adecuada para este mensaje de finanzas del hogar (Argentina). Opciones: '+cats.filter(c=>!c.income).map(c=>c.name).join(', ')+'. Mensaje: '+text+'. Respondé solo JSON: {"cat":"nombre exacto"}',{modelTier:'quick'});return cats.find(c=>c.name===(r&&r.cat))||null}catch(e){return null}}
const col=n=>db.collection(n);
async function put(t){await col('tx').doc(t.id).set(t)}
async function upd(id,p){await col('tx').doc(id).update(p)}
async function del(id){if(id.startsWith('r_'))await upd(id,{deleted:true});else await col('tx').doc(id).delete()}
function line(t){const c=cat(t.catId);return c.icon+' <b>'+esc(t.desc||c.name)+'</b> · <span class="'+t.type+'">'+(t.type==='exp'?'−':'+')+fmt(t.amount)+'</span><br><small class="mut">'+esc(c.name)+' · '+t.date.split('-').reverse().join('/')+(t.pay?' · '+PAYS[t.pay]:'')+(ac(t.acct)?' · '+esc(ac(t.acct).name):'')+' · pagó '+esc(nm(t.paidBy))+'</small>'}
function say(h,r){chat.push({r:r||'b',h});if(tab==='chat')drawMsgs()}
function drawMsgs(){const m=$('#msgs');if(!m)return;m.innerHTML=chat.map(x=>'<div class="m '+(x.r==='u'?'u':'')+'">'+x.h+'</div>').join('');const mm=$('#main');mm.scrollTop=mm.scrollHeight}
async function save(tx){try{await put(tx);undos.push(()=>del(tx.id));
 say('✅ Guardado<br>'+line(tx)+'<div class="ac"><button class="b" onclick="undo()">Deshacer</button><button class="b" onclick="editTx(\''+tx.id+'\')">Editar</button></div>');if(!tx.acct&&accts.length)say((tx.type==='inc'?'¿En qué cuenta entró?':'¿De qué cuenta salió?')+' <div class="ac">'+accts.map(a=>'<button class="b" onclick="setAcct(\''+tx.id+'\',\''+a.id+'\')">'+esc(a.icon+' '+a.name)+'</button>').join('')+'</div>')}catch(e){say('⚠️ No pude guardar: '+esc(e.message||e.code||'error')+'. Probá de nuevo.')}}
async function setAcct(id,a){try{await upd(id,{acct:a});undos.push(()=>upd(id,{acct:''}));say('✔️ Cuenta asignada: '+esc(acName(a))+' · saldo <b>'+fmt(bal(a))+'</b>')}catch(e){say('⚠️ No pude asignar la cuenta.')}}
async function undo(){const f=undos.pop();if(!f)return say('No hay nada para deshacer.');try{await f();say('↩️ Listo, deshecho.')}catch(e){say('⚠️ No pude deshacer.')}}
function lastTx(){return act().filter(t=>t.type!=='tr').slice().sort((a,b)=>(b.createdAt||0)-(a.createdAt||0))[0]}
function period(n){const now=new Date(),y=now.getFullYear();let m;
 if(/\bayer\b/.test(n)){const d=ymd(addD(now,-1));return[d,d,'ayer']}if(/\bhoy\b/.test(n))return[today(),today(),'hoy'];
 if(/mes pasado/.test(n)){const d=new Date(y,now.getMonth()-1,1),k=ymd(d).slice(0,7);return[k+'-01',k+'-31',mlabel(k)]}
 const mi=MES.findIndex(x=>n.includes(x));if(mi>=0){const yy=(n.match(/\b(20\d\d)\b/)||[])[1]||y,k=yy+'-'+pad(mi+1);return[k+'-01',k+'-31',mlabel(k)]}
 if(/\bano\b/.test(n))return[y+'-01-01',y+'-12-31','este año'];const k=today().slice(0,7);return[k+'-01',k+'-31','este mes']}
function query(t,n){if(/tenemos|cuanto hay|efectivo|banco|cuenta/.test(n)&&!/gast|ingres|cobr/.test(n))return balTxt(n);const[a,b,l]=period(n),c=kwmatch(t),inc=/ingres|cobr|entr/.test(n),L=act().filter(x=>x.date>=a&&x.date<=b);
 if(/queda|balance|resultado|saldo/.test(n))return'Resultado de '+l+': <b class="'+(sum(L,'inc')-sum(L,'exp')>=0?'inc':'exp')+'">'+fmt(sum(L,'inc')-sum(L,'exp'))+'</b><br><small class="mut">Ingresos '+fmt(sum(L,'inc'))+' · Gastos '+fmt(sum(L,'exp'))+'</small>';
 const T=inc?'inc':'exp',F=L.filter(x=>x.type===T&&(!c||x.catId===c.id));
 return(inc?'Ingresaron ':'Gastamos ')+'<b>'+fmt(sum(F,T))+'</b> '+(c&&!inc?'en '+esc(c.name)+' ':'')+(['ayer','hoy','este mes','este año'].includes(l)?l:'en '+l)+' <small class="mut">('+F.length+' movimientos)</small>'}
async function handle(text){const n=norm(text).replace(/[¿?¡!]/g,'').trim();
 if(/^(deshacer|deshaz|undo)\b/.test(n))return undo();
 if(/^(igual|guardalo igual|si guardalo)$/.test(n)&&dupTx){const t=dupTx;dupTx=null;return save(t)}
 if(/cuanto|queda|balance|resultado/.test(n)&&!/corregi|elimina|borra/.test(n))return say(query(text,n));
 if(/(corregi|corrige|cambia|modifica|^el ultimo)/.test(n)){const l=lastTx();if(!l)return say('Todavía no hay movimientos.');
  const a=parseAmt(text.replace(/\b\d{1,2}\/\d{1,2}/g,'')),p=parsePay(n),ch={};
  if(a)ch.amount=a.v;if(p)ch.pay=p;if(/\bayer\b/.test(n))ch.date=parseDate(n);if(/categoria/.test(n)){const c=kwmatch(n.split('categoria')[1]||'');if(c)ch.catId=c.id}
  if(!Object.keys(ch).length)return say('¿Qué querés cambiar del último movimiento? (importe, medio de pago, categoría)');
  const old={};Object.keys(ch).forEach(k=>old[k]=l[k]??'');try{await upd(l.id,ch);undos.push(()=>upd(l.id,old));say('✏️ Corregido<br>'+line({...l,...ch})+'<div class="ac"><button class="b" onclick="undo()">Deshacer</button></div>')}catch(e){say('⚠️ No pude corregir.')}return}
 if(/\b(elimina|borra|quita|saca)/.test(n)){const m=n.match(/(?:de la|del|de el|de)\s+(.+)$/),w=m&&m[1].trim();let t=null;
  if(/ultimo/.test(n))t=lastTx();else if(w)t=act().filter(x=>norm(x.desc||'').includes(w.split(' ')[0])).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0))[0];
  if(!t)return say('No encontré ese movimiento. Probá con «eliminá el último» o abrilo desde Historial.');
  try{await del(t.id);undos.push(()=>t.id.startsWith('r_')?upd(t.id,{deleted:false}):put(t));say('🗑️ Eliminado<br>'+line(t)+'<div class="ac"><button class="b" onclick="undo()">Deshacer</button></div>')}catch(e){say('⚠️ No pude eliminar.')}return}
 let full=text;if(pending){full=pending+' '+text;pending=null}
 const p=parse(full);
 if(p.own)return say('Eso parece una transferencia entre tus cuentas, así que no lo registré como ingreso ni gasto. Para mover plata entre cuentas usá Más > Transferir.');
 if(!p.amount){pending=full;return say('No vi un importe claro. ¿Cuánto fue?')}
 if(p.amount>1e10)return say('Ese importe me parece demasiado alto, ¿lo revisás?');
 let auto=false;if(!p.catId){const c=await aiCat(full);p.catId=(c||cats.find(x=>x.name==='Otros')||cats[0]||{}).id;auto=true}
 if(!p.desc)p.desc=cat(p.catId).name;
 const tx={id:crypto.randomUUID(),type:p.type,amount:p.amount,desc:p.desc,date:p.date,catId:p.catId,pay:p.pay,acct:p.acct||'',paidBy:p.paidBy,by:me,createdAt:Date.now()};
 const d=act().find(x=>x.amount===tx.amount&&norm(x.desc)===norm(tx.desc)&&x.date===tx.date&&tx.createdAt-(x.createdAt||0)<180000);
 if(d){dupTx=tx;return say('⚠️ Parece un duplicado de un movimiento recién cargado:<br>'+line(d)+'<br>Si es otro distinto, escribí «igual» para guardarlo.')}
 await save(tx);if(auto)say('<small class="mut">Categoría sugerida automáticamente. Si no es correcta, tocá Editar.</small>')}
function send(){const i=$('#ci'),t=i.value.trim();if(!t)return;i.value='';say(esc(t),'u');handle(t)}
function setTab(t){tab=t;render(true)}
function fill(t){$('#ci').value=t;$('#ci').focus()}

function loginUI(){$('#cb').hidden=true;$('#nav').innerHTML='';$('#main').innerHTML='<div class="card f"><h3>Ingresar</h3><label>Email<input id="l_e" type="email" autocomplete="username"></label><label>Contraseña<input id="l_p" type="password" autocomplete="current-password"></label><button class="b p" onclick="login()">Entrar</button><div id="l_m" class="exp"></div></div>'}
async function login(){const{error}=await sb.auth.signInWithPassword({email:V('l_e').trim().toLowerCase(),password:V('l_p')});if(error){const m=error.message||'';$('#l_m').textContent=(/invalid login/i.test(m)?'Email o contraseña incorrectos.':/not confirmed/i.test(m)?'El email del usuario no está confirmado en Supabase.':'No se pudo ingresar.')+' (Detalle: '+m+')';return}boot()}
async function boot(){if(SB_URL.startsWith('PEGAR')){$('#main').innerHTML='<div class="card">Falta configurar la base de datos: abrí index.html y completá SB_URL y SB_KEY.</div>';return}
 sb=sb||supabase.createClient(SB_URL,SB_KEY);const{data}=await sb.auth.getSession();if(!data.session)return loginUI();email=data.session.user.email;uid=lsg();if(!uid)return whoUI();init()}
const lsg=()=>{try{return localStorage.getItem('fin_yo')}catch(e){return null}};
async function whoUI(){const{data}=await sb.from('docs').select('id,data').eq('coll','people');$('#cb').hidden=true;$('#nav').innerHTML='';
 $('#main').innerHTML='<div class="card f"><h3>¿Quién sos?</h3><div class="mut">Se recuerda en este celular. Lo podés cambiar desde Más.</div>'+(data||[]).filter(r=>r.data.name).map(r=>'<button class="b" onclick="pickWho(\''+r.id+'\')">'+esc(r.data.name)+'</button>').join('')+'<label>Otro nombre<input id="w_n" maxlength="20" placeholder="Tu nombre"></label><button class="b p" onclick="newWho()">Continuar</button><div id="w_m" class="exp"></div></div>'}
function pickWho(id){try{localStorage.setItem('fin_yo',id)}catch(e){}uid=id;init()}
async function newWho(){const n=V('w_n').trim();if(!n){$('#w_m').textContent='Escribí tu nombre.';return}const id='p_'+norm(n).replace(/[^a-z0-9]+/g,'_');const{error}=await sb.from('docs').upsert({coll:'people',id,data:{name:n}});if(error){$('#w_m').textContent='No se pudo guardar.';return}pickWho(id)}
function changeWho(){try{localStorage.removeItem('fin_yo')}catch(e){}location.reload()}
boot();
